name: Paired text v2 validation
on:
  push:
    branches: [main]
    tags: [dra-thal-gyur-paired-v*]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          lfs: false
      - name: Validate source-only formats, exact releases and final signoff
        run: python3 -B paired/validate.py --require-final
      - name: Reject corrupted fixtures and reproduce the test receipt
        run: |
          python3 -B paired/test_paired.py > /tmp/paired-negative-tests.json
          cmp /tmp/paired-negative-tests.json paired/NEGATIVE-TESTS.json
      - name: Check migration, complete lineage and manifest reproducibility
        run: |
          python3 -B paired/migrate.py --check
          python3 -B paired/project.py --check
          git diff --exit-code
